# northstar_evals package config.
# Install editable from lab/evals: pip install -e .
# Or put lab/evals on PYTHONPATH. No third-party dependencies.

[project]
name = "northstar-evals"
version = "1.0.0"
description = "Eval library for the Northstar lab: datasets, slices, gates, providers."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
northstar-evals = "northstar_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["northstar_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
