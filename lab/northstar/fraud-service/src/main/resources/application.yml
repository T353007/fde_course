server:
  port: 8084

spring:
  application:
    name: fraud-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:northstar}
    username: ${DB_USER:northstar}
    password: ${DB_PASSWORD:northstar}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: northstar
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

northstar:
  sentinel:
    base-url: ${SENTINEL_BASE_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.northstar.fraud: INFO
