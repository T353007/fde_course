[project]
name = "northstar-ai-service"
version = "0.1.0"
description = "Model work for the Northstar Capital lab. FastAPI, four swappable providers, offline by default."
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Hosted providers. You do not need these to run the lab.
hosted = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
]
# Real embeddings. Downloads a model on first use, so it stays optional.
# The hash based fallback embedder works with nothing installed.
embeddings = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
ollama-check = "ai_service.tools.ollama_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
# The lab pins nothing tighter than this on purpose. Learners run different
# Python patch versions and we do not want a lockfile fight in week one.
package = true
